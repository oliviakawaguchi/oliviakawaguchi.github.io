name: Daily screen

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC, after the US close
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency: screen

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Re-rank the universe
        run: python3 -W ignore screen/build.py daily
        env:
          SEC_UA: "Olivia Kawaguchi rk5407@stern.nyu.edu"
      - name: Commit the new ranking
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screen/data
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Screen: $(date -u +%F)"
          git push
      - name: Rebuild the site
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
        env:
          GH_TOKEN: ${{ github.token }}
