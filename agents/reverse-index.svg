<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 498" width="1240" height="498" font-family="Helvetica, Arial, sans-serif">
  <rect width="1240" height="498" fill="#ffffff"/>
  <text x="40" y="30" font-size="25" font-weight="700" fill="#111">The Reverse Index: from a missing number to whoever must publish it</text>
  <text x="40" y="54" font-size="15.5" fill="#555">Terminals search company &#8594; metric. MKS discloses none of these. We searched quantity &#8594; discloser.</text>

  <rect x="40" y="70" width="1160" height="34" fill="#eef1f4"/>
  <rect x="336" y="70" width="348" height="34" fill="#e3eee6"/>
  <text x="56"  y="93" font-size="15" font-weight="700" fill="#333">Variable MKS does not disclose</text>
  <text x="352" y="93" font-size="15" font-weight="700" fill="#2f6b43">Agent: who is obliged to publish it?</text>
  <text x="700" y="93" font-size="15" font-weight="700" fill="#333">Primary source retrieved</text>
  <text x="1016" y="93" font-size="15" font-weight="700" fill="#333">Result</text>
  <text x="332" y="93" font-size="15" fill="#888">&#8594;</text>
  <text x="680" y="93" font-size="15" fill="#888">&#8594;</text>
  <text x="996" y="93" font-size="15" fill="#888">&#8594;</text>

  <line x1="40" y1="104" x2="1200" y2="104" stroke="#aaa" stroke-width="1"/>
  <line x1="40" y1="192" x2="1200" y2="192" stroke="#ddd" stroke-width="1"/>
  <line x1="40" y1="280" x2="1200" y2="280" stroke="#ddd" stroke-width="1"/>
  <line x1="40" y1="368" x2="1200" y2="368" stroke="#aaa" stroke-width="1"/>
  <line x1="336" y1="70" x2="336" y2="368" stroke="#ddd" stroke-width="1"/>
  <line x1="684" y1="70" x2="684" y2="368" stroke="#ddd" stroke-width="1"/>
  <line x1="1000" y1="70" x2="1000" y2="368" stroke="#ddd" stroke-width="1"/>
  <rect x="336" y="105" width="348" height="263" fill="#f3f8f4"/>
  <line x1="336" y1="70" x2="336" y2="368" stroke="#bcd5c3" stroke-width="1"/>
  <line x1="684" y1="70" x2="684" y2="368" stroke="#bcd5c3" stroke-width="1"/>

  <text x="56" y="130" font-size="15.5" font-weight="700" fill="#222">Chemicals vs equipment</text>
  <text x="56" y="150" font-size="15.5" font-weight="700" fill="#222">revenue mix</text>
  <text x="352" y="130" font-size="15.5" font-weight="700" fill="#1f5132">The previous owner.</text>
  <text x="352" y="152" font-size="14.5" fill="#1f5132">Atotech was NYSE-listed and filed</text>
  <text x="352" y="172" font-size="14.5" fill="#1f5132">20-Fs until MKS bought it in 2022.</text>
  <text x="700" y="130" font-size="14.5" fill="#333">SEC EDGAR, CIK 1762459</text>
  <text x="700" y="152" font-size="14.5" fill="#333">FY2021 20-F, read in full</text>
  <text x="1016" y="140" font-size="22" font-weight="700" fill="#1f5132">87% / 13%</text>
  <text x="1016" y="162" font-size="13.5" fill="#666">chemicals / equipment</text>

  <text x="56" y="218" font-size="15.5" font-weight="700" fill="#222">Profitability gap between</text>
  <text x="56" y="238" font-size="15.5" font-weight="700" fill="#222">the two businesses</text>
  <text x="352" y="218" font-size="15.5" font-weight="700" fill="#1f5132">Competitors in another language.</text>
  <text x="352" y="240" font-size="14.5" fill="#1f5132">Uyemura and JCU are required to</text>
  <text x="352" y="260" font-size="14.5" fill="#1f5132">report the split Japan-side.</text>
  <text x="700" y="218" font-size="14.5" fill="#333">EDINET, 13 annual reports,</text>
  <text x="700" y="240" font-size="14.5" fill="#333">read in Japanese</text>
  <text x="1016" y="228" font-size="22" font-weight="700" fill="#1f5132">3.9&#8211;32.2pt</text>
  <text x="1016" y="250" font-size="13.5" fill="#666">12 observations &#8212; not a</text>
  <text x="1016" y="266" font-size="13.5" fill="#666">fixed coefficient</text>

  <text x="56" y="306" font-size="15.5" font-weight="700" fill="#222">Metal consumption</text>
  <text x="352" y="306" font-size="15.5" font-weight="700" fill="#1f5132">Physics, not finance.</text>
  <text x="352" y="328" font-size="14.5" fill="#1f5132">Faraday&#8217;s law makes customers&#8217;</text>
  <text x="352" y="348" font-size="14.5" fill="#1f5132">substrate area a financial variable.</text>
  <text x="700" y="306" font-size="14.5" fill="#333">JEITA industry statistics;</text>
  <text x="700" y="328" font-size="14.5" fill="#333">substrate makers&#8217; disclosures</text>
  <text x="1016" y="312" font-size="17" font-weight="700" fill="#8a5a1a">Rate of change only</text>
  <text x="1016" y="334" font-size="13.5" fill="#8a5a1a">Loading per unit area is</text>
  <text x="1016" y="350" font-size="13.5" fill="#8a5a1a">undisclosed &#8212; no level.</text>

  <rect x="40" y="386" width="1160" height="58" fill="#fdf3ec" stroke="#d9a877" stroke-width="1.4"/>
  <text x="58" y="410" font-size="15.5" font-weight="700" fill="#8a4b12">The same filing cut against me.</text>
  <text x="300" y="410" font-size="15.5" fill="#6b3d12">Atotech discloses that palladium is contractually passed through to nearly all customers:</text>
  <text x="58" y="432" font-size="15.5" fill="#6b3d12">a price move changes gross margin percent and leaves gross profit dollars untouched. I revised my thesis down.</text>

  <text x="40" y="478" font-size="14" fill="#555">The research agent proposed where to look and pulled the filings. I set the question, judged what was comparable, and made the call.</text>
</svg>
